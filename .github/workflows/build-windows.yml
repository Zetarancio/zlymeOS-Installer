name: Build Windows

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc --features icon

      - name: Rename binary
        shell: bash
        run: cp "target/x86_64-pc-windows-msvc/release/zlyme-installer.exe" "zlyme-installer-windows.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zlyme-installer-windows.exe
          path: zlyme-installer-windows.exe

      # Build All moves the beta tag to its own commit before dispatching this
      # build. If the branch moved in between, these binaries are not the commit
      # the tag names, so refuse to upload them.
      - name: Check the beta tag names this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: beta-${{ github.ref_name }}
        run: |
          tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"
          echo "${TAG} is ${tag_sha}; this build is ${GITHUB_SHA}"
          [ "${tag_sha}" = "${GITHUB_SHA}" ] || { echo "beta tag and build commit differ; rerun Build All Platforms"; exit 1; }

      - name: Upload to Beta Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: beta-${{ github.ref_name }}
          # Branch builds must never take the Latest slot: the installer's own
          # update check reads /releases/latest, so a beta there would tell every
          # user to "update" to a branch build.
          prerelease: true
          make_latest: false
          files: zlyme-installer-windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
