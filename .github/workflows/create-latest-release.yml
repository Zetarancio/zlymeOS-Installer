name: Create Latest Release

# Publishes a normal release from an already-built beta. Branch builds stay
# prereleases on beta-<branch>, so build that first. This workflow does not
# mark the result as a draft or a prerelease, so GitHub can make it Latest.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. V1.6'
        required: true
      source_tag:
        description: 'Beta release to promote'
        required: true
        default: 'beta-zlyme-installer'

jobs:
  create-latest-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download the beta assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -e
          # A beta tag is reused build after build, so it can still hold binaries
          # older than the code being released. Refuse those. This fork releases
          # from zlyme-installer, not upstream main.
          BRANCH=zlyme-installer
          HEAD_DATE="$(gh api "repos/$GITHUB_REPOSITORY/commits/${BRANCH}" --jq '.commit.committer.date')"
          echo "$BRANCH committed $HEAD_DATE"
          gh release view "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[] | "\(.updatedAt) \(.name)"' | sort > assets.txt
          # Read from a file, not a pipe: a pipeline would put this loop in a
          # subshell and its exit would not fail the step.
          while read -r ts name; do
            echo "  $ts $name"
            [[ "$ts" > "$HEAD_DATE" ]] || { echo "$name is older than $BRANCH; build the beta first"; exit 1; }
          done < assets.txt

          mkdir -p dist
          gh release download "$SOURCE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber
          # A release missing a platform is worse than no release at all.
          for f in zlyme-installer-windows.exe \
                   zlyme-installer-macOS-Universal.zip \
                   zlyme-installer-linux-x64.tar.gz \
                   zlyme-installer-linux-arm64.tar.gz \
                   zlyme-installer-linux-armv7.tar.gz \
                   zlyme-installer-linux-i686.tar.gz; do
            [ -f "dist/$f" ] || { echo "$SOURCE_TAG has no $f"; exit 1; }
          done
          ls -la dist

      - name: Write the release notes
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -e
          cat > notes.md <<'NOTES'
          ## Downloads

          | Platform | Download |
          |----------|----------|
          | Windows (x64) | [zlyme-installer-windows.exe](https://github.com/__REPO__/releases/download/__TAG__/zlyme-installer-windows.exe) |
          | macOS (Apple Silicon + Intel) | [zlyme-installer-macOS-Universal.zip](https://github.com/__REPO__/releases/download/__TAG__/zlyme-installer-macOS-Universal.zip) |
          | Linux x64 | [zlyme-installer-linux-x64.tar.gz](https://github.com/__REPO__/releases/download/__TAG__/zlyme-installer-linux-x64.tar.gz) |
          | Linux ARM64 | [zlyme-installer-linux-arm64.tar.gz](https://github.com/__REPO__/releases/download/__TAG__/zlyme-installer-linux-arm64.tar.gz) |
          | Linux ARMv7 | [zlyme-installer-linux-armv7.tar.gz](https://github.com/__REPO__/releases/download/__TAG__/zlyme-installer-linux-armv7.tar.gz) |
          | Linux i686 (32-bit) | [zlyme-installer-linux-i686.tar.gz](https://github.com/__REPO__/releases/download/__TAG__/zlyme-installer-linux-i686.tar.gz) |

          ---

          ## Installation Instructions

          ### Windows
          1. Download `zlyme-installer-windows.exe`
          2. Run the executable
          3. If Windows SmartScreen appears, click "More info" → "Run anyway" (app is not code-signed)
          4. The installer will automatically request administrator privileges when needed

          The installer supports Windows 7 and later (x64).

          ### Linux
          1. Download the appropriate binary for your architecture
          2. Extract: `tar -xzf zlyme-installer-linux-*.tar.gz`
          3. Run: `./zlyme-installer-linux-*`
          4. The installer will automatically request privileges

          ### macOS
          1. Extract the zip file
          2. Double-click `launch-installer.command` to run

          **If the app can't see your SD card:**
          - You may need to grant Full Disk Access in System Settings → Privacy & Security
          - Add either Terminal (if running via command line) or the app itself
          - Restart the app after granting access

          **Opening unsigned apps:** https://support.apple.com/guide/mac-help/open-a-mac-app-from-an-unknown-developer-mh40616/mac

          ---
          Universal binary for Apple Silicon (M1/M2/M3/M4) and Intel Macs. Not code-signed.

          The Zlyme Installer is based on the SpruceOS Installer. Thanks to the SpruceOS team for the original work and for their support.

          More about Zlyme: https://github.com/Zetarancio/zlyme
          NOTES
          # __REPO__ is the workflow repository (owner/name), not a hard-coded fork.
          sed -i "s|__TAG__|${TAG}|g; s|__REPO__|${GITHUB_REPOSITORY}|g" notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
        run: |
          set -e
          # A normal release, not a draft and not a prerelease, so it can become
          # Latest. Branch betas stay prereleases and are not touched here.
          # An earlier test may already have left this tag as a draft.
          set +e
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft > release-state.json 2>release-view.err
          view_status=$?
          set -e
          if [ "$view_status" -ne 0 ]; then
            if grep -qi 'not found' release-view.err; then
              echo "$TAG does not exist. Creating a normal release."
              gh release create "$TAG" dist/* \
                --repo "$GITHUB_REPOSITORY" \
                --target zlyme-installer \
                --title "zlyme Installer $TAG" \
                --notes-file notes.md
            else
              cat release-view.err
              echo "Could not tell whether $TAG exists. Not creating or changing a release."
              exit 1
            fi
          else
            is_draft="$(python3 -c 'import json; print("true" if json.load(open("release-state.json"))["isDraft"] else "false")')"
            if [ "$is_draft" != "true" ]; then
              echo "$TAG is already published. Refusing to change a public release."
              exit 1
            fi
            echo "$TAG is a draft. Replacing its assets and publishing it."
            gh release upload "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft=false \
              --prerelease=false \
              --target zlyme-installer \
              --title "zlyme Installer $TAG" \
              --notes-file notes.md
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets \
            --jq '"tag=\(.tagName) draft=\(.isDraft) prerelease=\(.isPrerelease) assets=\([.assets[].name] | join(","))"' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets --jq '
            if .isDraft != false or .isPrerelease != false then error("release is still a draft or prerelease") else empty end
          '
          for f in zlyme-installer-windows.exe \
                   zlyme-installer-macOS-Universal.zip \
                   zlyme-installer-linux-x64.tar.gz \
                   zlyme-installer-linux-arm64.tar.gz \
                   zlyme-installer-linux-armv7.tar.gz \
                   zlyme-installer-linux-i686.tar.gz; do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | grep -qx "$f" || { echo "published release is missing $f"; exit 1; }
          done
