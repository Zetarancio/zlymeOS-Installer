name: Refresh Manifest

# Regenerates manifest.json from the image sources and replaces it on the
# latest release, so the TF1 Image tab follows their releases without an
# installer release.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  refresh-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate and upload to the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          python3 manifest/generate.py
          jq empty manifest/manifest.json
          TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          echo "Latest release is $TAG"
          gh release upload "$TAG" manifest/manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          echo "manifest.json replaced on $TAG" >> "$GITHUB_STEP_SUMMARY"
